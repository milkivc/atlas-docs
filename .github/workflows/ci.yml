name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Validate Metadata & Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AJV CLI
        run: npm install -g ajv-cli

      - name: Validate metadata.json against schema
        run: |
          ajv validate -s .github/schemas/metadata-schema.json -d metadata.json --spec=draft7

      - name: Check JSON syntax
        run: |
          jq empty metadata.json
          for file in $(find . -type f -name "*.json" ! -path "./.git/*" ! -path "./.github/*"); do
            jq empty "$file" || { echo "Invalid JSON: $file"; exit 1; }
          done

  test-docs:
    name: Test Documentation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'

      - name: Check for broken references
        run: |
          # Check if all referenced files exist
          for file in $(grep -r "\[.*\](.*\.md)" --include="*.md" . | grep -oP '\[.*\]\([^)]+\)' | grep -oP '[^)]+\.md' | sort -u); do
            if [ ! -f "$file" ] && [ ! -f "docs/$file" ] && [ ! -f "technical/$file" ] && [ ! -f "legal/$file" ] && [ ! -f "financial/$file" ]; then
              echo "Broken reference: $file"
              exit 1
            fi
          done

  lint:
    name: Lint Markdown & YAML
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: avturlyak/markdown-lint@v1
        with:
          config: '.github/markdownlint-config.json'
          args: '**/*.md'

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: '.github/yamllint-config.yml'
