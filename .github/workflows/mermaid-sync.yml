name: Mermaid Diagrams — Manual Validation Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate repository diagrams only
        shell: bash
        run: |
          set -euo pipefail
          echo "Manual validation only."
          echo "No local skills, external directories, secrets, commits, pushes or publications are permitted."
          find diagrams docs/diagrams -type f \( -name '*.mmd' -o -name '*.mermaid' -o -name '*.md' \) -print 2>/dev/null || true

      - name: Confirm non-publication policy
        run: |
          echo "Validation completed without modifying the repository."
          git status --porcelain
          test -z "$(git status --porcelain)"
